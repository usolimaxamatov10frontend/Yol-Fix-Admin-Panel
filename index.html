<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YolFix — Yo'llarni Tuzatish platformasi</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="yf_logo_solo (1).svg">
</head>

<body>
    <div class="wrapper">
        <!-- Header / Logo Area -->
        <header class="title">
            <div class="logo">
                <i class="fa-regular fa-circle-check"></i>
            </div>
            <div class="name">
                <p class="yolfix">Yol<span>Fix</span></p>
                <p class="admin">Admin</p>
            </div>
        </header>

        <!-- Main Card -->
        <main class="login-card">
            <h1 class="log-h1">Xush kelibsiz</h1>
            <p class="log-text">Boshqaruv paneliga kirish uchun ma'lumotlaringizni kiriting</p>

            <form class="login-form" onsubmit="event.preventDefault();">
                <div class="field-group">
                    <label for="emailInput" class="input-label">Email</label>
                    <div class="inpicn">
                        <div class="icon"><i class="fa-regular fa-envelope"></i></div>
                        <input id="emailInput" class="log-inp" type="email" name="Email" placeholder="email@misol.uz">
                    </div>
                </div>

                <div class="field-group">
                    <div class="label-row">
                        <label for="passwordInput" class="input-label">Parol</label>
                        <a class="log-link" href="#">Parolni unutdingizmi?</a>
                    </div>
                    <div class="inpicn">
                        <div class="icon"><i class="fa-solid fa-lock"></i></div>
                        <input id="passwordInput" class="log-inp" type="password" name="Password" placeholder="••••••••">
                    </div>
                </div>

                <div class="chekb">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe" class="chekb-text">Meni eslab qol</label>
                </div>

                <button id="loginButton" type="submit" class="log-btn">Kirish</button>
            </form>

            <div class="textt">
                <a class="textt1" href="admin.html">Demo panelga to'g'ridan-to'g'ri o'tish &rarr;</a>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            &copy; 2026 Ubaydulla. Barcha huquqlar himoyalangan.
        </footer>
    </div>

    <script src="./main.js"></script>
</body>

</html>
